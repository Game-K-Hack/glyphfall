[package]
name = "glyphfall"
version = "0.2.0"
edition = "2024"
# Déclarée ici autant que dans LICENSE : cargo, les miroirs et les outils
# d'audit de dépendances ne lisent que ce champ.
license = "GPL-3.0-only"

# Android charge une bibliothèque partagée, le bureau un exécutable : les deux
# sortent du même code.
[lib]
# Un nom distinct de l'exécutable : sur Windows, deux cibles homonymes se
# disputeraient le même fichier de symboles.
name = "glyphfall_core"
crate-type = ["lib", "cdylib"]

[dependencies]
include_dir = "0.7.4"
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "pcm", "vorbis", "wav"] }
toml = "1.1.4"

[features]
# Force la mise en page téléphone sur un bureau, pour la regarder sans APK.
portrait = []

[dev-dependencies]
fontdue = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1.3"
