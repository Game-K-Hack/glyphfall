# Les niveaux d'API du paquet Android, en un seul endroit.
#
# Ils étaient écrits deux fois — dans `tools/android.py` et dans
# `app/build.gradle` — parce qu'`aapt2` ne sait pas lire un fichier Gradle et
# que Gradle refuse de les voir dans le manifeste. Les deux se lisent ici, et
# ne peuvent donc plus diverger.
#
# `targetSdk` n'est délibérément pas calé sur la plateforme la plus récente
# installée : chaque niveau apporte des changements de comportement qui
# peuvent casser le jeu en silence. `tools/android.py` prévient quand un
# niveau plus récent est disponible, et c'est alors une décision, pas un
# effet de bord.
#
# Google Play impose de viser un niveau au plus vieux d'un an, au 31 août de
# chaque année. Le passage à 36 est celui du 31 août 2026.
minSdk=26
targetSdk=36
