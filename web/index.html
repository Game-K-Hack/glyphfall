<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlphaTiles</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1a1c2c;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Le jeu s'agrandit d'un facteur entier : sans cela, le navigateur
               interpolerait par-dessus et flouterait chaque pixel. */
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <!-- L'ordre compte : sapp_jsutils avant quad-storage, qui s'appuie dessus. -->
    <script src="gl.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script src="quad-storage.js"></script>
    <script>
        // Sans cela, la barre d'espace et les flèches feraient défiler la page
        // au lieu d'arriver au jeu.
        window.addEventListener("keydown", (event) => {
            if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                event.preventDefault();
            }
        });

        load("alphatiles.wasm");
    </script>
</body>

</html>
