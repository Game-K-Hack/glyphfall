# Quel enregistrement pour quel kana.
#
# Les noms de fichiers viennent du fournisseur : la fin donne la
# romanisation Hepburn, celle que le jeu accepte deja comme reponse.
#
# Les memes enregistrements servent aux deux syllabaires : un kana et
# son jumeau notent le meme son. Et deux kana peuvent partager un
# fichier -- ji s'ecrit じ ou ぢ, zu s'ecrit ず ou づ, mais cela ne
# s'entend plus.

