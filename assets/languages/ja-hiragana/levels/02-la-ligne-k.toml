id = "hira-02"
title = "La ligne K"
subtitle = "Cinq signes de plus"
order = 2
requires = ["hira-01"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "か"
answers = ["ka"]
pronunciation = """
Se lit « ka », en un seul temps.
  Équivalent français : le C de « Carte » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant ajouter.",
    "Une croix penchee suivie d'une virgule.",
]

[[glyphs]]
char = "き"
answers = ["ki"]
pronunciation = """
Se lit « ki », en un seul temps.
  Équivalent français : le C de « Carte » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Cursive du kanji signifiant plusieurs.",
    "Une cle avec deux barres.",
]

[[glyphs]]
char = "く"
answers = ["ku"]
pronunciation = """
Se lit « ku », en un seul temps.
  Équivalent français : le C de « Carte » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant longtemps.",
    "Un bec ouvert vers la droite.",
]

[[glyphs]]
char = "け"
answers = ["ke"]
pronunciation = """
Se lit « ke », en un seul temps.
  Équivalent français : le C de « Carte » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant calcul.",
    "Un k dont la barre verticale est detachee.",
]

[[glyphs]]
char = "こ"
answers = ["ko"]
pronunciation = """
Se lit « ko », en un seul temps.
  Équivalent français : le C de « Carte » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant soi.",
    "Deux traits couches, comme deux cordes.",
]
