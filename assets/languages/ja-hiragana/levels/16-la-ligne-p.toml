id = "hira-16"
title = "La ligne P"
subtitle = "Un petit rond cette fois"
order = 16
requires = ["hira-15"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ぱ"
answers = ["pa"]
pronunciation = """
Se lit « pa », en un seul temps.
  Équivalent français : le P de « Panne » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le ha avec le petit rond : le rond donne toujours un P, ha donne pa.",
]

[[glyphs]]
char = "ぴ"
answers = ["pi"]
pronunciation = """
Se lit « pi », en un seul temps.
  Équivalent français : le P de « Panne » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Le hi avec le petit rond : le rond donne toujours un P, hi donne pi.",
]

[[glyphs]]
char = "ぷ"
answers = ["pu"]
pronunciation = """
Se lit « pu », en un seul temps.
  Équivalent français : le P de « Panne » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Le fu avec le petit rond : le rond donne toujours un P, fu donne pu.",
]

[[glyphs]]
char = "ぺ"
answers = ["pe"]
pronunciation = """
Se lit « pe », en un seul temps.
  Équivalent français : le P de « Panne » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le he avec le petit rond : le rond donne toujours un P, he donne pe.",
]

[[glyphs]]
char = "ぽ"
answers = ["po"]
pronunciation = """
Se lit « po », en un seul temps.
  Équivalent français : le P de « Panne » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Le ho avec le petit rond : le rond donne toujours un P, ho donne po.",
]
