id = "hira-10"
title = "La ligne M"
subtitle = "Presque au bout"
order = 10
requires = ["hira-09"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ま"
answers = ["ma"]
pronunciation = """
Se lit « ma », en un seul temps.
  Équivalent français : le M de « Mer » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant fin.",
    "Deux barres traversees par une boucle.",
]

[[glyphs]]
char = "み"
answers = ["mi"]
pronunciation = """
Se lit « mi », en un seul temps.
  Équivalent français : le M de « Mer » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Cursive du kanji signifiant beaute.",
    "Un 3 auquel on a ajoute une queue.",
]

[[glyphs]]
char = "む"
answers = ["mu"]
pronunciation = """
Se lit « mu », en un seul temps.
  Équivalent français : le M de « Mer » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant militaire.",
    "Une vache vue de profil : meuh, mu.",
]

[[glyphs]]
char = "め"
answers = ["me"]
pronunciation = """
Se lit « me », en un seul temps.
  Équivalent français : le M de « Mer » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant femme.",
    "Comme le nu, mais sans la boucle finale.",
]

[[glyphs]]
char = "も"
answers = ["mo"]
pronunciation = """
Se lit « mo », en un seul temps.
  Équivalent français : le M de « Mer » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant aussi.",
    "Un hamecon a deux barres.",
]
