id = "hira-06"
title = "Revision : S et T"
subtitle = "On consolide avant la suite"
order = 6
requires = ["hira-05"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.25

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "さ"
answers = ["sa"]
pronunciation = """
Se lit « sa », en un seul temps.
  Équivalent français : le S de « Sable » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant gauche.",
    "Un s dont on a barre le haut.",
]

[[glyphs]]
char = "し"
answers = ["shi", "si"]
pronunciation = """
Se lit « chi », en un seul temps.
  Équivalent français : le CHI de « Chic ».

Jamais « si » : devant le i, toute la ligne S glisse vers le son [ch].
"""
mnemonics = [
    "Cursive du kanji signifiant lui.",
    "Un hamecon. Se prononce chi, jamais si.",
]

[[glyphs]]
char = "す"
answers = ["su"]
pronunciation = """
Se lit « su », en un seul temps.
  Équivalent français : le S de « Sable » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant tenir.",
    "Une boucle nouee sous une barre.",
]

[[glyphs]]
char = "せ"
answers = ["se"]
pronunciation = """
Se lit « se », en un seul temps.
  Équivalent français : le S de « Sable » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant monde.",
    "Une fourche a deux dents barree.",
]

[[glyphs]]
char = "そ"
answers = ["so"]
pronunciation = """
Se lit « so », en un seul temps.
  Équivalent français : le S de « Sable » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant ceci.",
    "Un zigzag qui descend d'un trait.",
]

[[glyphs]]
char = "た"
answers = ["ta"]
pronunciation = """
Se lit « ta », en un seul temps.
  Équivalent français : le T de « Table » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant grand.",
    "Un t suivi d'un petit trait, comme un ta ecrit vite.",
]

[[glyphs]]
char = "ち"
answers = ["chi", "ti"]
pronunciation = """
Se lit « tchi », en un seul temps.
  Équivalent français : le TCHI de « Tchèque ».

Jamais « ti » : devant le i, la ligne T glisse vers le son [tch].
"""
mnemonics = [
    "Cursive du kanji signifiant savoir.",
    "Le ta retourne. Se prononce tchi.",
]

[[glyphs]]
char = "つ"
answers = ["tsu", "tu"]
pronunciation = """
Se lit « tsou » : le T et le S collés, en un seul temps.
  Équivalent français : le TS de « Tsar », suivi du OU de « Fou » aux lèvres
  au repos.

Jamais « tou » : le S fait partie du son, il ne s'ajoute pas.
"""
mnemonics = [
    "Cursive du kanji signifiant fleuve.",
    "Une vague. Se prononce tsou.",
]

[[glyphs]]
char = "て"
answers = ["te"]
pronunciation = """
Se lit « te », en un seul temps.
  Équivalent français : le T de « Table » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant main.",
    "Une main tendue vue de profil.",
]

[[glyphs]]
char = "と"
answers = ["to"]
pronunciation = """
Se lit « to », en un seul temps.
  Équivalent français : le T de « Table » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant s'arreter.",
    "Un clou plante, avec sa pointe.",
]
