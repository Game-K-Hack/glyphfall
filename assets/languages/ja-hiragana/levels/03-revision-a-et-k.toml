id = "hira-03"
title = "Revision : A et K"
subtitle = "Dix signes deja"
order = 3
requires = ["hira-02"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.00

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "あ"
answers = ["a"]
pronunciation = """
Se lit « a », en un seul temps.
  Équivalent français : le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant paisible.",
    "Un A majuscule auquel on aurait ajoute une boucle.",
]

[[glyphs]]
char = "い"
answers = ["i"]
pronunciation = """
Se lit « i », en un seul temps.
  Équivalent français : le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Cursive du kanji signifiant comme.",
    "Deux traits paralleles, comme les deux jambages du i.",
]

[[glyphs]]
char = "う"
answers = ["u"]
pronunciation = """
Se lit « u », en un seul temps.
  Équivalent français : le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant maison.",
    "Un u penche coiffe d'un accent.",
]

[[glyphs]]
char = "え"
answers = ["e"]
pronunciation = """
Se lit « e », en un seul temps.
  Équivalent français : le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant riviere.",
    "Un z surmonte d'un trait.",
]

[[glyphs]]
char = "お"
answers = ["o"]
pronunciation = """
Se lit « o », en un seul temps.
  Équivalent français : le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant lettre.",
    "Le a avec un trait de plus en haut a droite. A ne pas confondre avec lui.",
]

[[glyphs]]
char = "か"
answers = ["ka"]
pronunciation = """
Se lit « ka », en un seul temps.
  Équivalent français : le C de « Carte » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant ajouter.",
    "Une croix penchee suivie d'une virgule.",
]

[[glyphs]]
char = "き"
answers = ["ki"]
pronunciation = """
Se lit « ki », en un seul temps.
  Équivalent français : le C de « Carte » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Cursive du kanji signifiant plusieurs.",
    "Une cle avec deux barres.",
]

[[glyphs]]
char = "く"
answers = ["ku"]
pronunciation = """
Se lit « ku », en un seul temps.
  Équivalent français : le C de « Carte » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant longtemps.",
    "Un bec ouvert vers la droite.",
]

[[glyphs]]
char = "け"
answers = ["ke"]
pronunciation = """
Se lit « ke », en un seul temps.
  Équivalent français : le C de « Carte » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant calcul.",
    "Un k dont la barre verticale est detachee.",
]

[[glyphs]]
char = "こ"
answers = ["ko"]
pronunciation = """
Se lit « ko », en un seul temps.
  Équivalent français : le C de « Carte » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant soi.",
    "Deux traits couches, comme deux cordes.",
]
