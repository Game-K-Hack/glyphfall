id = "hira-13"
title = "Revision : le syllabaire"
subtitle = "Les 46 signes de base"
order = 13
requires = ["hira-12"]
mode = "tile_fall"

[rules]
lives = 3
duration = 90
columns = 4
spawn_interval = 1.4
speed = { start = 55.0, ramp = 1.5, max = 165.0 }
review_ratio = 0.50

[stars]
one = 0.50
two = 0.72
three = 0.90

[[glyphs]]
char = "お"
answers = ["o"]
mnemonics = [
    "Cursive du kanji signifiant lettre.",
    "Le a avec un trait de plus en haut a droite. A ne pas confondre avec lui.",
]

[[glyphs]]
char = "し"
answers = ["shi", "si"]
mnemonics = [
    "Cursive du kanji signifiant lui.",
    "Un hamecon. Se prononce chi, jamais si.",
]

[[glyphs]]
char = "ち"
answers = ["chi", "ti"]
mnemonics = [
    "Cursive du kanji signifiant savoir.",
    "Le ta retourne. Se prononce tchi.",
]

[[glyphs]]
char = "ぬ"
answers = ["nu"]
mnemonics = [
    "Cursive du kanji signifiant serviteur.",
    "Comme le me, mais avec une boucle au bout. Nouer une boucle : nu.",
]

[[glyphs]]
char = "め"
answers = ["me"]
mnemonics = [
    "Cursive du kanji signifiant femme.",
    "Comme le nu, mais sans la boucle finale.",
]

[[glyphs]]
char = "ほ"
answers = ["ho"]
mnemonics = [
    "Cursive du kanji signifiant garantir.",
    "Le ha avec une barre de plus en haut.",
]

[[glyphs]]
char = "る"
answers = ["ru"]
mnemonics = [
    "Cursive du kanji signifiant rester.",
    "Comme le ro, mais termine par une boucle fermee.",
]

[[glyphs]]
char = "ん"
answers = ["n"]
mnemonics = [
    "Cursive du kanji signifiant infini.",
    "La seule consonne qui tient seule, sans voyelle.",
]

[[glyphs]]
char = "を"
answers = ["wo", "o"]
mnemonics = [
    "Cursive du kanji signifiant lointain.",
    "Ne sert que de particule : il marque le complement d'objet. Se prononce o.",
]
