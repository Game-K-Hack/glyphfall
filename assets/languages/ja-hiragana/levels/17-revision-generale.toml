id = "hira-17"
title = "Revision generale"
subtitle = "Tout le syllabaire"
order = 17
requires = ["hira-16"]
mode = "tile_fall"

[rules]
lives = 3
duration = 90
columns = 4
spawn_interval = 1.4
speed = { start = 55.0, ramp = 1.5, max = 165.0 }
review_ratio = 0.50

[stars]
one = 0.50
two = 0.72
three = 0.90

[[glyphs]]
char = "が"
answers = ["ga"]
pronunciation = """
Se lit « ga », en un seul temps.
  Équivalent français : le G de « Gare » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le ka avec les deux petits traits : la sourde devient sonore, ka donne ga.",
]

[[glyphs]]
char = "じ"
answers = ["ji", "zi"]
pronunciation = """
Se lit « dji », en un seul temps.
  Équivalent français : le DJI de « Djibouti ».

Jamais « zi » : devant le i, la ligne Z glisse vers le son [dj].
"""
mnemonics = [
    "Le shi avec les deux petits traits. Se lit ji, pas zi.",
]

[[glyphs]]
char = "づ"
answers = ["zu", "du"]
pronunciation = """
Se lit « dzou », presque comme le zu de la ligne Z.
  Équivalent français : un DZ suivi du OU aux lèvres au repos.

Presque disparu : sauf exception, ce son s'écrit avec le zu de la ligne Z.
"""
mnemonics = [
    "Le tsu avec les deux petits traits. Meme son que le zu precedent, mais rare.",
]

[[glyphs]]
char = "ぱ"
answers = ["pa"]
pronunciation = """
Se lit « pa », en un seul temps.
  Équivalent français : le P de « Panne » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le ha avec le petit rond : le rond donne toujours un P, ha donne pa.",
]

[[glyphs]]
char = "ぴ"
answers = ["pi"]
pronunciation = """
Se lit « pi », en un seul temps.
  Équivalent français : le P de « Panne » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Le hi avec le petit rond : le rond donne toujours un P, hi donne pi.",
]

[[glyphs]]
char = "ぶ"
answers = ["bu"]
pronunciation = """
Se lit « bu », en un seul temps.
  Équivalent français : le B de « Bal » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Le fu avec les deux petits traits : la sourde devient sonore, fu donne bu.",
]

[[glyphs]]
char = "べ"
answers = ["be"]
pronunciation = """
Se lit « be », en un seul temps.
  Équivalent français : le B de « Bal » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le he avec les deux petits traits : la sourde devient sonore, he donne be.",
]

[[glyphs]]
char = "ぞ"
answers = ["zo"]
pronunciation = """
Se lit « zo », en un seul temps.
  Équivalent français : le Z de « Zèbre » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Le so avec les deux petits traits : la sourde devient sonore, so donne zo.",
]
