id = "hira-07"
title = "La ligne N"
subtitle = "Cinq signes tout ronds"
order = 7
requires = ["hira-06"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "な"
answers = ["na"]
pronunciation = """
Se lit « na », en un seul temps.
  Équivalent français : le N de « Nappe » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Cursive du kanji signifiant quoi.",
    "Une croix suivie d'une boucle.",
]

[[glyphs]]
char = "に"
answers = ["ni"]
pronunciation = """
Se lit « ni », en un seul temps.
  Équivalent français : le N de « Nappe » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Cursive du kanji signifiant benevolence.",
    "Un trait vertical suivi de deux traits couches.",
]

[[glyphs]]
char = "ぬ"
answers = ["nu"]
pronunciation = """
Se lit « nu », en un seul temps.
  Équivalent français : le N de « Nappe » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Cursive du kanji signifiant serviteur.",
    "Comme le me, mais avec une boucle au bout. Nouer une boucle : nu.",
]

[[glyphs]]
char = "ね"
answers = ["ne"]
pronunciation = """
Se lit « ne », en un seul temps.
  Équivalent français : le N de « Nappe » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Cursive du kanji signifiant genou.",
    "Comme le nu, mais la boucle est ouverte.",
]

[[glyphs]]
char = "の"
answers = ["no"]
pronunciation = """
Se lit « no », en un seul temps.
  Équivalent français : le N de « Nappe » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Cursive du kanji signifiant sur.",
    "Une spirale unique, le kana le plus simple a reconnaitre.",
]
