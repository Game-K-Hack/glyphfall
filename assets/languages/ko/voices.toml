# Quel enregistrement pour quel signe.
#
# Les noms de fichiers viennent du fournisseur : `kr-f-` et `kr-m-`
# distinguent les deux voix, la fin donne la romanisation. Les garder
# tels quels permet de recouper avec la source d'origine.
#
# Deux signes peuvent pointer sur le même fichier : une voyelle prononcée
# seule est exactement la syllabe que forme le cercle muet, donc ㅏ et 아
