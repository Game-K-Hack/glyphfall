id = "ko-08"
title = "Quatre voyelles simples"
subtitle = "Un trait, quatre directions"
order = 8
requires = ["ko-07"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.25

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ㅏ"
answers = ["a"]
pronunciation = """
Un seul son : [a] ouvert, la bouche bien dégagée.
  Équivalent français : le A de « Papa ».

Il reste bref : le coréen n'allonge pas ses voyelles comme le fait « pâte ».
"""
mnemonics = [
    "Le trait vertical est l'humain debout ; le point du soleil s'est pose a sa droite.",
    "Le soleil a l'est : le son sort devant, bouche grande ouverte.",
]

[[glyphs]]
char = "ㅓ"
answers = ["eo"]
pronunciation = """
Un seul son : [o] relâché, la bouche ouverte et les lèvres au repos.
  Équivalent français : entre le O de « bol » et le EU de « peur ».

À ne pas confondre avec le o : celui-ci ne s'arrondit jamais.
"""
mnemonics = [
    "Le miroir du a : le soleil est passe a gauche, le son recule dans la bouche.",
    "Entre le o et le e francais, comme le eu de peur.",
]

[[glyphs]]
char = "ㅗ"
answers = ["o"]
pronunciation = """
Un seul son : [o] fermé, les lèvres bien arrondies et poussées en avant.
  Équivalent français : le O de « eau ».

C'est l'arrondi qui le sépare du eo. Exagérez-le au début.
"""
mnemonics = [
    "La barre est la terre, le trait au-dessus est le soleil qui se leve.",
    "Le soleil au-dessus de l'horizon : les levres s'arrondissent.",
]

[[glyphs]]
char = "ㅜ"
answers = ["u"]
pronunciation = """
Un seul son : [ou], les lèvres arrondies et serrées.
  Équivalent français : le OU de « Fou ».

Jamais le U de « lune » : ce son français n'existe pas en coréen.
"""
mnemonics = [
    "Le miroir du o : le soleil est passe sous la terre.",
    "Se prononce ou et jamais u : le u francais n'existe pas en coreen.",
]
