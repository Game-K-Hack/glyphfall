id = "ko-03"
title = "Revision : six traits"
subtitle = "Tout ce que l'on sait deja"
order = 3
requires = ["ko-02"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.00

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "ㄱ"
answers = ["g", "k"]
name = "giyeok"
pronunciation = """
Début de mot : entre [g] et [k], perçu comme un [k] doux.
  Équivalent français : le C de « Carte », sans le souffle qui suit.

Entre deux voyelles : franchement [g].
  Équivalent français : le G de « Gare ».

En fin de syllabe : la gorge se ferme sans rien laisser sortir.
  Équivalent français : le C de « sac » coupé net.
"""
mnemonics = [
    "Le dessin de la langue qui se souleve au fond de la gorge pour bloquer l'air.",
    "Un coin, ou un G majuscule qui aurait perdu sa boucle. Son nom : giyeok.",
]

[[glyphs]]
char = "ㄴ"
answers = ["n"]
name = "nieun"
pronunciation = """
Partout le même son : [n], la langue collée derrière les dents du haut.
  Équivalent français : le N de « Nature ».

En fin de syllabe, il s'entend encore, là où le français l'avale dans la voyelle.
  Équivalent français : le N de « Anne », pas celui de « an ».
"""
mnemonics = [
    "Le bout de la langue collee derriere les dents du haut, vue de profil.",
    "Un L a l'envers, ou le bas d'un N. Son nom : nieun.",
]

[[glyphs]]
char = "ㄷ"
answers = ["d", "t"]
name = "digeut"
pronunciation = """
Début de mot : entre [d] et [t], plutôt un [t] doux.
  Équivalent français : le T de « Table », sans le souffle qui suit.

Entre deux voyelles : franchement [d].
  Équivalent français : le D de « Date ».

En fin de syllabe : la langue se pose et rien ne sort.
  Équivalent français : le T de « net » coupé net.
"""
mnemonics = [
    "Le nieun que l'on referme par le haut : meme langue, contact plus ferme.",
    "Forme d'un d sans sa barre, ou d'une porte vue de cote (door). Son nom : digeut.",
]

[[glyphs]]
char = "ㄹ"
answers = ["r", "l"]
name = "rieul"
pronunciation = """
Début de mot et entre deux voyelles : un [r] battu, la langue effleure le
palais une seule fois. Elle ne roule pas et ne racle pas.
  Équivalent français : aucun. Le R de « Paris » est bien trop en arrière ;
  visez le R espagnol de « pero ».

En fin de syllabe : un [l] net.
  Équivalent français : le L de « bal ».
"""
mnemonics = [
    "Le zigzag de la langue qui roule puis retombe.",
    "Forme d'une route qui zigzague (route). Son nom : rieul.",
]

[[glyphs]]
char = "ㅁ"
answers = ["m"]
name = "mieum"
pronunciation = """
Partout le même son : [m], les deux lèvres fermées puis relâchées.
  Équivalent français : le M de « Mer ».

En fin de syllabe, la bouche reste fermée sur le son au lieu de le nasaliser.
  Équivalent français : le M de « pomme », pas celui de « pompe ».
"""
mnemonics = [
    "Le dessin de la bouche fermee, vue de face : un carre.",
    "Le M de mouth, ou de mieum, son nom.",
]

[[glyphs]]
char = "ㅂ"
answers = ["b", "p"]
name = "bieup"
pronunciation = """
Début de mot : entre [b] et [p], perçu comme un [p] doux.
  Équivalent français : le P de « Panne », sans le souffle qui suit.

Entre deux voyelles : franchement [b].
  Équivalent français : le B de « Bal ».

En fin de syllabe : les lèvres se ferment et rien ne sort.
  Équivalent français : le P de « cap » coupé net.
"""
mnemonics = [
    "Le carre de la bouche qui s'entrouvre : deux traits s'echappent vers le haut.",
    "Forme d'un bol a deux anses (bol). Son nom : bieup.",
]
