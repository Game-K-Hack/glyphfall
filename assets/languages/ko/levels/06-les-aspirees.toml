id = "ko-06"
title = "Les aspirees"
subtitle = "Un trait de plus, un souffle de plus"
order = 6
requires = ["ko-05"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ㅋ"
answers = ["k"]
name = "kieuk"
pronunciation = """
Partout : [k] soufflé. C'est le giyeok avec de l'air en plus.
  Équivalent français : le K de « Kilo », en expirant franchement.

En fin de syllabe : la gorge se ferme, comme pour le giyeok.
  Équivalent français : le C de « sac » coupé net.
"""
mnemonics = [
    "Le giyeok avec un trait de plus : meme geste, souffle en plus.",
    "Forme d'une cle dentee (key). Son nom : kieuk.",
]

[[glyphs]]
char = "ㅌ"
answers = ["t"]
name = "tieut"
pronunciation = """
Partout : [t] soufflé. C'est le digeut avec de l'air en plus.
  Équivalent français : le T de « Table », en expirant franchement.

En fin de syllabe : un [t] retenu, sans souffle cette fois.
  Équivalent français : le T de « net » coupé net.
"""
mnemonics = [
    "Le digeut avec un trait de plus a l'interieur.",
    "Forme d'un E, ou d'un trident sans le manche (trident). Son nom : tieut.",
]

[[glyphs]]
char = "ㅍ"
answers = ["p"]
name = "pieup"
pronunciation = """
Partout : [p] soufflé. C'est le bieup avec de l'air en plus.
  Équivalent français : le P de « Panne », en expirant franchement.

En fin de syllabe : les lèvres se ferment et rien ne sort.
  Équivalent français : le P de « cap » coupé net.
"""
mnemonics = [
    "Le bieup couche a plat, ouvert en haut et en bas.",
    "Forme d'un pont sur deux piles (pont), ou d'un pi grec a qui l'on aurait ajoute une barre. Son nom : pieup.",
]
