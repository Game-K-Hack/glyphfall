id = "ko-14"
title = "La voyelle passe dessous"
subtitle = "Quand elle est horizontale"
order = 14
requires = ["ko-13"]
mode = "tile_fall"

[rules]
lives = 3
duration = 70
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 1.0, max = 130.0 }
review_ratio = 0.25

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "고"
answers = ["go", "ko"]
pronunciation = """
Début de mot : « ko » doux.
Ailleurs : « go ».
  Équivalent français : le CO de « Corde », lèvres arrondies.

Dans « goyangi », le chat.
"""
mnemonics = [
    "Giyeok plus o. Une voyelle horizontale se place SOUS la consonne, jamais a cote.",
    "C'est la seule regle de placement a retenir : verticale a droite, horizontale dessous.",
]

[[glyphs]]
char = "노"
answers = ["no"]
pronunciation = """
Se lit « no », toujours de la même façon.
  Équivalent français : le NO de « Noble », lèvres arrondies.

Dans « norae », la chanson.
"""
mnemonics = [
    "Nieun plus o, la voyelle glissee dessous car elle est horizontale.",
]

[[glyphs]]
char = "도"
answers = ["do", "to"]
pronunciation = """
Début de mot : « to » doux.
Ailleurs : « do ».
  Équivalent français : le TO de « Tome », puis le DO de « Dos ».

Dans « doshi », la ville.
"""
mnemonics = [
    "Digeut plus o, la voyelle dessous. On le trouve dans doshi, la ville.",
]

[[glyphs]]
char = "무"
answers = ["mu"]
pronunciation = """
Se lit « mou », toujours de la même façon.
  Équivalent français : le MOU de « Mousse ».

Dans « mu », le radis, à lui tout seul.
"""
mnemonics = [
    "Mieum plus u, la voyelle dessous. Se lit mou et non mu.",
]

[[glyphs]]
char = "부"
answers = ["bu", "pu"]
pronunciation = """
Début de mot : « pou » doux.
Ailleurs : « bou ».
  Équivalent français : le POU de « Poule », puis le BOU de « Bouche ».

Dans « bumo », les parents.
"""
mnemonics = [
    "Bieup plus u, la voyelle dessous. Se lit bou. Comme dans bumo, les parents.",
]

[[glyphs]]
char = "수"
answers = ["su"]
pronunciation = """
Se lit « sou », toujours de la même façon.
  Équivalent français : le SOU de « Soupe ».

Dans « subak », la pastèque.
"""
mnemonics = [
    "Siot plus u, la voyelle dessous. Se lit sou, comme dans susu, le mais.",
]
