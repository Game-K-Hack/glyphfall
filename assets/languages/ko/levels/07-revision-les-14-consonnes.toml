id = "ko-07"
title = "Revision : les 14 consonnes"
subtitle = "Le premier grand cap"
order = 7
requires = ["ko-06"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.00

[stars]
one = 0.50
