id = "ko-07"
title = "Revision : les 14 consonnes"
subtitle = "Le premier grand cap"
order = 7
requires = ["ko-06"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.00

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "ㄱ"
answers = ["g", "k"]
mnemonics = [
    "Le dessin de la langue qui se souleve au fond de la gorge pour bloquer l'air.",
    "Un coin, ou un G majuscule qui aurait perdu sa boucle. Son nom : giyeok.",
]

[[glyphs]]
char = "ㄴ"
answers = ["n"]
mnemonics = [
    "Le bout de la langue collee derriere les dents du haut, vue de profil.",
    "Un L a l'envers, ou le bas d'un N. Son nom : nieun.",
]

[[glyphs]]
char = "ㄷ"
answers = ["d", "t"]
mnemonics = [
    "Le nieun que l'on referme par le haut : meme langue, contact plus ferme.",
    "Forme d'un d sans sa barre, ou d'une porte vue de cote (door). Son nom : digeut.",
]

[[glyphs]]
char = "ㄹ"
answers = ["r", "l"]
mnemonics = [
    "Le zigzag de la langue qui roule puis retombe.",
    "Forme d'une route qui zigzague (route). Son nom : rieul.",
]

[[glyphs]]
char = "ㅁ"
answers = ["m"]
mnemonics = [
    "Le dessin de la bouche fermee, vue de face : un carre.",
    "Le M de mouth, ou de mieum, son nom.",
]

[[glyphs]]
char = "ㅂ"
answers = ["b", "p"]
mnemonics = [
    "Le carre de la bouche qui s'entrouvre : deux traits s'echappent vers le haut.",
    "Forme d'un bol a deux anses (bol). Son nom : bieup.",
]

[[glyphs]]
char = "ㅅ"
answers = ["s"]
mnemonics = [
    "Le dessin d'une dent pointue : le souffle passe entre les dents.",
    "Forme d'un sommet de montagne (sommet). Son nom : siot.",
]

[[glyphs]]
char = "ㅇ"
answers = ["ng"]
mnemonics = [
    "Le dessin de la gorge ouverte, un cercle.",
    "Forme d'un zero : au debut, il ne vaut rien. Son nom : ieung.",
]

[[glyphs]]
char = "ㅈ"
answers = ["j"]
mnemonics = [
    "La dent du siot coiffee d'un chapeau : meme endroit, l'air est bloque avant.",
    "Forme de jambes croisees sous une table (jambes). Son nom : jieut.",
]

[[glyphs]]
char = "ㅊ"
answers = ["ch"]
mnemonics = [
    "Le jieut avec un trait de plus : en hangeul, un trait ajoute veut dire souffle ajoute.",
    "Le jieut coiffe d'un chapeau (chapeau). Son nom : chieut.",
]

[[glyphs]]
char = "ㅋ"
answers = ["k"]
mnemonics = [
    "Le giyeok avec un trait de plus : meme geste, souffle en plus.",
    "Forme d'une cle dentee (key). Son nom : kieuk.",
]

[[glyphs]]
char = "ㅌ"
answers = ["t"]
mnemonics = [
    "Le digeut avec un trait de plus a l'interieur.",
    "Forme d'un E, ou d'un trident sans le manche (trident). Son nom : tieut.",
]

[[glyphs]]
char = "ㅍ"
answers = ["p"]
mnemonics = [
    "Le bieup couche a plat, ouvert en haut et en bas.",
    "Forme d'un pont sur deux piles (pont), ou d'un pi grec a qui l'on aurait ajoute une barre. Son nom : pieup.",
]

[[glyphs]]
char = "ㅎ"
answers = ["h"]
mnemonics = [
    "Un chapeau pose sur la gorge ouverte : le souffle sort par le haut.",
    "Forme d'un homme a chapeau (hat). Son nom : hieut.",
]
