[[glyphs]]
char = "一"
answers = ["1", "un", "ichi"]
pronunciation = """
Lecture ON, venue du chinois : ICHI.
  Dans « ichigatsu », janvier.

Lecture KUN, japonaise : hito(tsu).
  Dans « hitotsu », une chose.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un trait, un. L'ecriture chinoise commence par le plus simple.",
]

[[glyphs]]
char = "二"
answers = ["2", "deux", "ni"]
pronunciation = """
Lecture ON, venue du chinois : NI.
  Dans « nigatsu », février.

Lecture KUN, japonaise : futa(tsu).
  Dans « futatsu », deux choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Deux traits pour deux : le compte continue apres le trait unique.",
]

[[glyphs]]
char = "三"
answers = ["3", "trois", "san"]
pronunciation = """
Lecture ON, venue du chinois : SAN.
  Dans « sangatsu », mars.

Lecture KUN, japonaise : mit(tsu).
  Dans « mittsu », trois choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Trois traits, trois. Au-dela, on cesse de compter les traits.",
]
