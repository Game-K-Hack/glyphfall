Lecture ON, venue du chinois : SHICHI.
  Dans « shichigatsu », juillet.

Lecture KUN, japonaise : nana(tsu).
  Dans « nanatsu », sept choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
