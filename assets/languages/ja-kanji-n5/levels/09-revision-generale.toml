id = "kanji-09"
title = "Revision generale"
subtitle = "Nombres, jours et paysage"
order = 9
requires = ["kanji-08"]
mode = "tile_fall"

[rules]
lives = 3
duration = 90
columns = 4
spawn_interval = 1.4
speed = { start = 55.0, ramp = 1.5, max = 165.0 }
review_ratio = 0.50

[stars]
one = 0.50
two = 0.72
three = 0.90

[[glyphs]]
char = "人"
answers = ["personne", "homme", "humain"]
pronunciation = """
Lecture ON, venue du chinois : JIN, NIN.
  Dans « nihonjin », un Japonais.

Lecture KUN, japonaise : hito.
  Dans « hito », une personne.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Deux jambes qui marchent, vues de face.",
]

