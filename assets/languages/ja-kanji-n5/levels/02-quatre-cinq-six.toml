id = "kanji-02"
title = "Quatre, cinq, six"
subtitle = "La suite se complique un peu"
order = 2
requires = ["kanji-01"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "四"
answers = ["4", "quatre", "shi", "yon"]
pronunciation = """
Lecture ON, venue du chinois : SHI.
  Dans « shigatsu », avril.

Lecture KUN, japonaise : yon, yot(tsu).
  Dans « yottsu », quatre choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Une bouche avec deux jambes dedans.",
    "On evite souvent shi, homophone de la mort : on dit yon.",
]

[[glyphs]]
char = "五"
answers = ["5", "cinq", "go"]
pronunciation = """
Lecture ON, venue du chinois : GO.
  Dans « gogatsu », mai.

Lecture KUN, japonaise : itsu(tsu).
  Dans « itsutsu », cinq choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un sablier entre deux barres.",
]

[[glyphs]]
char = "六"
answers = ["6", "six", "roku"]
pronunciation = """
Lecture ON, venue du chinois : ROKU.
  Dans « rokugatsu », juin.

Lecture KUN, japonaise : mut(tsu).
  Dans « muttsu », six choses.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un chapeau sur deux jambes.",
]
