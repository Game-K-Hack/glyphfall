id = "kanji-06"
title = "Eau, arbre, or"
subtitle = "Le milieu de la semaine"
order = 6
requires = ["kanji-05"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "水"
answers = ["eau"]
pronunciation = """
Lecture ON, venue du chinois : SUI.
  Dans « suiyobi », mercredi.

Lecture KUN, japonaise : mizu.
  Dans « mizu », l'eau.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un cours d'eau avec ses eclaboussures.",
    "Mercredi est le jour de l'eau.",
]

[[glyphs]]
char = "木"
answers = ["arbre", "bois"]
pronunciation = """
Lecture ON, venue du chinois : MOKU, BOKU.
  Dans « mokuyobi », jeudi.

Lecture KUN, japonaise : ki.
  Dans « ki », l'arbre.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un tronc avec ses branches et ses racines.",
    "Jeudi est le jour de l'arbre.",
]

[[glyphs]]
char = "金"
answers = ["or", "argent"]
pronunciation = """
Lecture ON, venue du chinois : KIN, KON.
  Dans « kinyobi », vendredi.

Lecture KUN, japonaise : kane.
  Dans « okane », l'argent qu'on dépense.

Le ON sert dans les mots composés, le KUN quand le kanji est seul.
"""
mnemonics = [
    "Un toit sur des pepites enfouies.",
    "Vendredi est le jour de l'or. Signifie aussi l'argent que l'on depense.",
]
