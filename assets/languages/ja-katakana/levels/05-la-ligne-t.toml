id = "kata-05"
title = "La ligne T"
subtitle = "Deux pieges dedans"
order = 5
requires = ["kata-04"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "タ"
answers = ["ta"]
pronunciation = """
Se lit « ta », en un seul temps.
  Équivalent français : le T de « Table » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Morceau du kanji signifiant beaucoup.",
    "Un ku barre d'un trait.",
]

[[glyphs]]
char = "チ"
answers = ["chi", "ti"]
pronunciation = """
Se lit « tchi », en un seul temps.
  Équivalent français : le TCHI de « Tchèque ».

Jamais « ti » : devant le i, la ligne T glisse vers le son [tch].
"""
mnemonics = [
    "Morceau du kanji signifiant mille.",
    "Un 7 barre. Se prononce tchi.",
]

[[glyphs]]
char = "ツ"
answers = ["tsu", "tu"]
pronunciation = """
Se lit « tsou » : le T et le S collés, en un seul temps.
  Équivalent français : le TS de « Tsar », suivi du OU de « Fou » aux lèvres
  au repos.

Jamais « tou » : le S fait partie du son, il ne s'ajoute pas.
"""
mnemonics = [
    "Morceau du meme kanji que le tsu hiragana.",
    "Trois traits qui MONTENT. Le shi a deux points, le tsu en a trois.",
]

[[glyphs]]
char = "テ"
answers = ["te"]
pronunciation = """
Se lit « te », en un seul temps.
  Équivalent français : le T de « Table » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Morceau du kanji signifiant ciel.",
    "Deux barres et une jambe.",
]

[[glyphs]]
char = "ト"
answers = ["to"]
pronunciation = """
Se lit « to », en un seul temps.
  Équivalent français : le T de « Table » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant s'arreter.",
    "Un trait vertical avec un ergot.",
]
