id = "kata-03"
title = "Revision : A et K"
subtitle = "Dix signes deja"
order = 3
requires = ["kata-02"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.00

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "ア"
answers = ["a"]
pronunciation = """
Se lit « a », en un seul temps.
  Équivalent français : le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Morceau du meme kanji que le a hiragana, celui qui signifie paisible.",
    "Un chevron surmonte d'un trait.",
]

[[glyphs]]
char = "イ"
answers = ["i"]
pronunciation = """
Se lit « i », en un seul temps.
  Équivalent français : le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Morceau gauche du kanji signifiant personne.",
    "Deux traits, comme le i hiragana mais anguleux.",
]

[[glyphs]]
char = "ウ"
answers = ["u"]
pronunciation = """
Se lit « u », en un seul temps.
  Équivalent français : le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Le toit du kanji signifiant maison.",
    "Un toit avec sa cheminee.",
]

[[glyphs]]
char = "エ"
answers = ["e"]
pronunciation = """
Se lit « e », en un seul temps.
  Équivalent français : le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le kanji signifiant travail, pris tel quel.",
    "Un H couche : trois barres, celle du milieu verticale.",
]

[[glyphs]]
char = "オ"
answers = ["o"]
pronunciation = """
Se lit « o », en un seul temps.
  Équivalent français : le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant sur.",
    "Une croix a laquelle pend un trait.",
]

[[glyphs]]
char = "カ"
answers = ["ka"]
pronunciation = """
Se lit « ka », en un seul temps.
  Équivalent français : le C de « Carte » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le kanji signifiant force, pris tel quel.",
    "A ne pas confondre avec ce kanji, qu'on verra plus tard.",
]

[[glyphs]]
char = "キ"
answers = ["ki"]
pronunciation = """
Se lit « ki », en un seul temps.
  Équivalent français : le C de « Carte » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Morceau du meme kanji que le ki hiragana.",
    "Une cle a deux dents, comme le ki hiragana mais anguleuse.",
]

[[glyphs]]
char = "ク"
answers = ["ku"]
pronunciation = """
Se lit « ku », en un seul temps.
  Équivalent français : le C de « Carte » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Morceau du kanji signifiant longtemps.",
    "Un bec, plus ferme que celui du ku hiragana. A ne pas confondre avec le wa et le ta.",
]

[[glyphs]]
char = "ケ"
answers = ["ke"]
pronunciation = """
Se lit « ke », en un seul temps.
  Équivalent français : le C de « Carte » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Morceau du kanji signifiant introduire.",
    "Un k anguleux, dont la jambe part vers le bas.",
]

[[glyphs]]
char = "コ"
answers = ["ko"]
pronunciation = """
Se lit « ko », en un seul temps.
  Équivalent français : le C de « Carte » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant soi.",
    "Un crochet ouvert a droite. A ne pas confondre avec le ro, ferme.",
]
