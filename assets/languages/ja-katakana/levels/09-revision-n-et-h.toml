id = "kata-09"
title = "Revision : N et H"
subtitle = "La moitie du chemin"
order = 9
requires = ["kata-08"]
mode = "tile_fall"

[rules]
lives = 3
duration = 75
columns = 4
spawn_interval = 1.5
speed = { start = 52.0, ramp = 1.2, max = 150.0 }
review_ratio = 0.25

[stars]
one = 0.50
two = 0.72
three = 0.88

[[glyphs]]
char = "ナ"
answers = ["na"]
pronunciation = """
Se lit « na », en un seul temps.
  Équivalent français : le N de « Nappe » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Morceau du kanji signifiant quoi.",
    "Une croix penchee, comme le debut du na hiragana.",
]

[[glyphs]]
char = "ニ"
answers = ["ni"]
pronunciation = """
Se lit « ni », en un seul temps.
  Équivalent français : le N de « Nappe » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Le kanji signifiant deux, pris tel quel.",
    "Deux traits : ni comme deux.",
]

[[glyphs]]
char = "ヌ"
answers = ["nu"]
pronunciation = """
Se lit « nu », en un seul temps.
  Équivalent français : le N de « Nappe » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Morceau du kanji signifiant serviteur.",
    "Comme le su, mais la jambe part de la barre.",
]

[[glyphs]]
char = "ネ"
answers = ["ne"]
pronunciation = """
Se lit « ne », en un seul temps.
  Équivalent français : le N de « Nappe » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Morceau du kanji signifiant genou.",
    "Une croix surmontee d'un trait, avec une jambe.",
]

[[glyphs]]
char = "ノ"
answers = ["no"]
pronunciation = """
Se lit « no », en un seul temps.
  Équivalent français : le N de « Nappe » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant sur.",
    "Un seul trait penche : le plus simple de tous.",
]

[[glyphs]]
char = "ハ"
answers = ["ha"]
pronunciation = """
Se lit « ha », en un seul temps.
  Équivalent français : un H expiré, jamais muet puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le kanji signifiant huit, pris tel quel.",
    "Deux traits qui s'ecartent.",
]

[[glyphs]]
char = "ヒ"
answers = ["hi"]
pronunciation = """
Se lit « hi », en un seul temps.
  Équivalent français : un H expiré, jamais muet puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Morceau du meme kanji que le hi hiragana.",
    "Un trait vertical avec un pied.",
]

[[glyphs]]
char = "フ"
answers = ["fu", "hu"]
pronunciation = """
Se lit « fou », mais soufflé entre les lèvres, sans mordre la lèvre du bas.
  Équivalent français : entre le F de « Fou » et un H expiré.

Ni un F net, ni un H seul : le son est à mi-chemin.
"""
mnemonics = [
    "Morceau du kanji signifiant inegal.",
    "Un seul angle. A ne pas confondre avec le wa et le ku.",
]

[[glyphs]]
char = "ヘ"
answers = ["he"]
pronunciation = """
Se lit « he », en un seul temps.
  Équivalent français : un H expiré, jamais muet puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le meme signe qu'en hiragana : une colline.",
    "Le seul kana identique dans les deux syllabaires.",
]

[[glyphs]]
char = "ホ"
answers = ["ho"]
pronunciation = """
Se lit « ho », en un seul temps.
  Équivalent français : un H expiré, jamais muet puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant garantir.",
    "Une croix avec deux jambes.",
]
