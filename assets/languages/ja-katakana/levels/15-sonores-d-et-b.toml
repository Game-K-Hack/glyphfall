id = "kata-15"
title = "Sonores D et B"
subtitle = "Dix de plus sur le meme principe"
order = 15
requires = ["kata-14"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.25

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ダ"
answers = ["da"]
pronunciation = """
Se lit « da », en un seul temps.
  Équivalent français : le D de « Dame » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le ta avec les deux petits traits : la sourde devient sonore, ta donne da.",
]

[[glyphs]]
char = "ヂ"
answers = ["ji", "di"]
pronunciation = """
Se lit « dji », exactement comme le ji de la ligne Z.
  Équivalent français : le DJI de « Djibouti ».

Presque disparu : sauf exception, ce son s'écrit avec le ji de la ligne Z.
"""
mnemonics = [
    "Le chi avec les deux petits traits. Meme son que le ji precedent, mais tres rare.",
]

[[glyphs]]
char = "ヅ"
answers = ["zu", "du"]
pronunciation = """
Se lit « dzou », presque comme le zu de la ligne Z.
  Équivalent français : un DZ suivi du OU aux lèvres au repos.

Presque disparu : sauf exception, ce son s'écrit avec le zu de la ligne Z.
"""
mnemonics = [
    "Le tsu avec les deux petits traits. Meme son que le zu precedent, mais rare.",
]

[[glyphs]]
char = "デ"
answers = ["de"]
pronunciation = """
Se lit « de », en un seul temps.
  Équivalent français : le D de « Dame » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le te avec les deux petits traits : la sourde devient sonore, te donne de.",
]

[[glyphs]]
char = "ド"
answers = ["do"]
pronunciation = """
Se lit « do », en un seul temps.
  Équivalent français : le D de « Dame » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Le to avec les deux petits traits : la sourde devient sonore, to donne do.",
]

[[glyphs]]
char = "バ"
answers = ["ba"]
pronunciation = """
Se lit « ba », en un seul temps.
  Équivalent français : le B de « Bal » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Le ha avec les deux petits traits : la sourde devient sonore, ha donne ba.",
]

[[glyphs]]
char = "ビ"
answers = ["bi"]
pronunciation = """
Se lit « bi », en un seul temps.
  Équivalent français : le B de « Bal » puis le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Le hi avec les deux petits traits : la sourde devient sonore, hi donne bi.",
]

[[glyphs]]
char = "ブ"
answers = ["bu"]
pronunciation = """
Se lit « bu », en un seul temps.
  Équivalent français : le B de « Bal » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Le fu avec les deux petits traits : la sourde devient sonore, fu donne bu.",
]

[[glyphs]]
char = "ベ"
answers = ["be"]
pronunciation = """
Se lit « be », en un seul temps.
  Équivalent français : le B de « Bal » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le he avec les deux petits traits : la sourde devient sonore, he donne be.",
]

[[glyphs]]
char = "ボ"
answers = ["bo"]
pronunciation = """
Se lit « bo », en un seul temps.
  Équivalent français : le B de « Bal » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Le ho avec les deux petits traits : la sourde devient sonore, ho donne bo.",
]
