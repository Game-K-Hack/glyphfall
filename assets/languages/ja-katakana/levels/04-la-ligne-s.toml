id = "kata-04"
title = "La ligne S"
subtitle = "Attention au troisieme"
order = 4
requires = ["kata-03"]
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.30

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "サ"
answers = ["sa"]
pronunciation = """
Se lit « sa », en un seul temps.
  Équivalent français : le S de « Sable » puis le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Morceau du kanji signifiant disperser.",
    "Deux traits verticaux barres.",
]

[[glyphs]]
char = "シ"
answers = ["shi", "si"]
pronunciation = """
Se lit « chi », en un seul temps.
  Équivalent français : le CHI de « Chic ».

Jamais « si » : devant le i, toute la ligne S glisse vers le son [ch].
"""
mnemonics = [
    "Morceau du meme kanji que le shi hiragana.",
    "Deux points et un trait qui MONTE. Le tsu, lui, descend.",
]

[[glyphs]]
char = "ス"
answers = ["su"]
pronunciation = """
Se lit « su », en un seul temps.
  Équivalent français : le S de « Sable » puis le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Morceau du kanji signifiant grand.",
    "Un chevron d'ou pend une jambe.",
]

[[glyphs]]
char = "セ"
answers = ["se"]
pronunciation = """
Se lit « se », en un seul temps.
  Équivalent français : le S de « Sable » puis le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Morceau du meme kanji que le se hiragana.",
    "Le se hiragana en plus anguleux.",
]

[[glyphs]]
char = "ソ"
answers = ["so"]
pronunciation = """
Se lit « so », en un seul temps.
  Équivalent français : le S de « Sable » puis le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant ceci.",
    "Un point et un trait qui DESCEND. Le n, lui, monte.",
]
