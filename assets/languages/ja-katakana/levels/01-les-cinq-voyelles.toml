id = "kata-01"
title = "Les cinq voyelles"
subtitle = "Le point de depart de tout"
order = 1
requires = []
mode = "tile_fall"

[rules]
lives = 3
duration = 50
columns = 4
spawn_interval = 1.7
speed = { start = 42.0, ramp = 0.8, max = 120.0 }
review_ratio = 0.00

[stars]
one = 0.50
two = 0.70
three = 0.85

[[glyphs]]
char = "ア"
answers = ["a"]
pronunciation = """
Se lit « a », en un seul temps.
  Équivalent français : le A de « Papa ».

Le A japonais est bref et net, jamais allongé comme dans « pâte ».
"""
mnemonics = [
    "Morceau du meme kanji que le a hiragana, celui qui signifie paisible.",
    "Un chevron surmonte d'un trait.",
]

[[glyphs]]
char = "イ"
answers = ["i"]
pronunciation = """
Se lit « i », en un seul temps.
  Équivalent français : le I de « Lit ».

Le I est franc et bref, jamais traîné.
"""
mnemonics = [
    "Morceau gauche du kanji signifiant personne.",
    "Deux traits, comme le i hiragana mais anguleux.",
]

[[glyphs]]
char = "ウ"
answers = ["u"]
pronunciation = """
Se lit « u », en un seul temps.
  Équivalent français : le OU de « Fou », mais les lèvres à peine arrondies.

Ni le OU de « Fou » ni le U de « Lune » : gardez les lèvres au repos.
"""
mnemonics = [
    "Le toit du kanji signifiant maison.",
    "Un toit avec sa cheminee.",
]

[[glyphs]]
char = "エ"
answers = ["e"]
pronunciation = """
Se lit « e », en un seul temps.
  Équivalent français : le È de « Père ».

Le E japonais est toujours ouvert, jamais le E muet de « je ».
"""
mnemonics = [
    "Le kanji signifiant travail, pris tel quel.",
    "Un H couche : trois barres, celle du milieu verticale.",
]

[[glyphs]]
char = "オ"
answers = ["o"]
pronunciation = """
Se lit « o », en un seul temps.
  Équivalent français : le O de « Eau ».

Le O est fermé et bref : « ko », jamais « kô ».
"""
mnemonics = [
    "Morceau du kanji signifiant sur.",
    "Une croix a laquelle pend un trait.",
]
