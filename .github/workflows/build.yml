name: Construction

# Ce workflow ne se déclenche plus tout seul sur une release : c'est
# `release-please.yml` qui l'appelle, une fois l'étiquette posée.
#
# La raison est une règle de GitHub : ce qu'un workflow fait avec le jeton par
# défaut ne déclenche pas d'autre workflow. Une release créée par
# release-please n'émettrait donc aucun événement, et rien ne se construirait.
# L'appeler directement évite d'avoir à confier un jeton personnel au dépôt.
on:
  workflow_call:
    inputs:
      version:
        description: L'étiquette publiée. Vide pour une construction d'essai.
        type: string
        required: false
        default: ""
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Vide en construction d'essai : les scripts retombent alors sur Cargo.toml.
  GLYPHFALL_VERSION: ${{ inputs.version }}

jobs:
  verification:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bibliothèques de compilation
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests, écran couché
        run: cargo test --release
      - name: Tests, écran debout
        run: cargo test --release --features portrait
      - name: Aucun avertissement
        run: |
          cargo rustc --release --lib -- -D warnings
          cargo rustc --release --bin glyphfall -- -D warnings

  windows:
    name: Windows x86_64
    needs: verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # Le script trouve Inno Setup sur la machine, ou en extrait une copie
      # portable. Même commande ici et chez soi, comme pour Linux et Android.
      - run: python tools/setup.py --sans-compiler

      # Les fichiers sont rassembles a plat avant d'etre publies.
      #
      # Avec plusieurs chemins, `upload-artifact` conserve l'arborescence
      # depuis leur ancetre commun : l'artefact Windows arrivait sous
      # `target/release/` et `installer/`, et la publication, qui ne ramasse
      # que le premier niveau, n'y voyait que des dossiers.
      - name: Rassembler
        shell: bash
        run: |
          mkdir -p publication
          cp target/release/glyphfall.exe publication/
          cp installer/glyphfall-windows-x86_64-setup.exe publication/
      - uses: actions/upload-artifact@v4
        with:
          name: glyphfall-windows-x86_64
          path: publication/

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cible: x86_64-unknown-linux-gnu
            debian: amd64
          - arch: arm64
            cible: aarch64-unknown-linux-gnu
            debian: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}
      - uses: Swatinem/rust-cache@v2
      # Les deux seules dépendances Python de toute la chaîne, et elles ne
      # servent qu'ici : `linux.py` charge `ziglang` et `deb.py` charge
      # `pillow`, tous deux à l'intérieur d'une fonction. Les retirer ne
      # casserait rien au chargement, seulement à l'exécution.
      - run: pip install ziglang pillow
      - run: cargo install cargo-zigbuild
      - run: python tools/linux.py --arch ${{ matrix.arch }}
      - run: python tools/deb.py --arch ${{ matrix.debian }}
      - name: Rassembler
        run: |
          mkdir -p publication
          cp target/linux/glyphfall-linux-${{ matrix.arch }}.tar.gz publication/
          cp target/deb/glyphfall_*_${{ matrix.debian }}.deb publication/
      - uses: actions/upload-artifact@v4
        with:
          name: glyphfall-linux-${{ matrix.arch }}
          path: publication/

  macos:
    name: macOS ${{ matrix.arch }}
    needs: verification
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cible: aarch64-apple-darwin
          - arch: x86_64
            cible: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.cible }}
      - name: Archive
        run: tar czf glyphfall-macos-${{ matrix.arch }}.tar.gz -C target/${{ matrix.cible }}/release glyphfall
      - uses: actions/upload-artifact@v4
        with:
          name: glyphfall-macos-${{ matrix.arch }}
          path: glyphfall-macos-${{ matrix.arch }}.tar.gz

  android:
    name: Android
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
      - name: APK
        run: python tools/android.py
      - uses: actions/upload-artifact@v4
        with:
          name: glyphfall-android
          path: target/android/glyphfall.apk

      # Le bundle pour Google Play, seulement si la clé de signature est là.
      # Sans elle — une construction d'essai, une fourche du dépôt — le job
      # s'arrête ici sans échouer : l'APK reste produit, et la publication ne
      # réclame aucun fichier en particulier.
      - name: Cle de signature
        id: cle
        env:
          MAGASIN: ${{ secrets.GLYPHFALL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MAGASIN" ]; then
            echo "Pas de cle de signature : le bundle Play est saute."
            exit 0
          fi
          echo "$MAGASIN" | base64 -d > "$RUNNER_TEMP/glyphfall.jks"
          echo "presente=oui" >> "$GITHUB_OUTPUT"
      - name: Bundle pour Google Play
        if: steps.cle.outputs.presente == 'oui'
        env:
          GLYPHFALL_KEYSTORE: ${{ runner.temp }}/glyphfall.jks
          GLYPHFALL_KEYSTORE_PASSWORD: ${{ secrets.GLYPHFALL_KEYSTORE_PASSWORD }}
          GLYPHFALL_KEY_ALIAS: ${{ secrets.GLYPHFALL_KEY_ALIAS }}
          GLYPHFALL_KEY_PASSWORD: ${{ secrets.GLYPHFALL_KEY_PASSWORD }}
        run: python tools/bundle.py
      - name: Effacer la cle
        if: always()
        run: rm -f "$RUNNER_TEMP/glyphfall.jks"
      - uses: actions/upload-artifact@v4
        if: steps.cle.outputs.presente == 'oui'
        with:
          # Volontairement hors du motif `glyphfall-*` de la publication : un
          # bundle ne s'installe pas, il ne se televerse que dans la Play
          # Console. L'attacher a la release ajouterait deux cent soixante-dix
          # megaoctets qu'aucun joueur ne peut ouvrir.
          name: play-bundle
          path: target/android/glyphfall.aab
          retention-days: 14

  web:
    name: Navigateur
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: python tools/web.py
      - name: Archive, pour la publication
        uses: actions/upload-artifact@v4
        with:
          name: glyphfall-web
          path: target/glyphfall-web.zip
      - name: Site deplie, pour les Pages
        uses: actions/upload-artifact@v4
        with:
          name: site-web
          path: target/web/

  pages:
    name: Publication web
    needs: web
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-web
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4

  publication:
    name: Publication
    if: inputs.version != ''
    needs: [windows, linux, macos, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Le site deplie est exclu : il n'a rien a faire dans une release,
          # et ses sept cents fichiers y seraient attaches un par un.
          pattern: glyphfall-*
          # Tout a plat dans un seul dossier, faute de quoi chaque artefact
          # arriverait dans son propre sous-dossier et le motif ci-dessous
          # ramasserait des dossiers autant que des fichiers. Les noms sont
          # distincts d'une plateforme a l'autre : rien ne s'ecrase.
          merge-multiple: true
          path: fichiers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: fichiers/*
